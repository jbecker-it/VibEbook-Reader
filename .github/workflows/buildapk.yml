name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Ermöglicht den manuellen Start über die GitHub-Oberfläche

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test comic and novel layout
      run: |
        npm install --no-save --ignore-scripts playwright@1.56.1
        npx playwright install --with-deps chromium
        node scripts/test-reader-layout.cjs

    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Test, lint, and build APK
      run: ./gradlew testDebugUnitTest lintDebug assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Print lint errors
      if: failure()
      run: |
        if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
        fi

    - name: Upload test and lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-reports
        path: |
          app/build/reports/
          app/build/test-results/
        retention-days: 14
