name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Ermöglicht den manuellen Start über die GitHub-Oberfläche

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FOLIO_VERSION_CODE: ${{ github.run_number }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test comic and novel layout
      run: |
        npm install --no-save --ignore-scripts playwright@1.56.1
        npx playwright install --with-deps chromium
        node scripts/test-reader-layout.cjs

    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Test, lint, and build APK
      run: ./gradlew testDebugUnitTest lintRelease assembleRelease
    
    - name: Test signing guards and repeatability
      run: python3 scripts/test-signing.py

    - name: Sign distributable APK with permanent key
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        FOLIO_SIGNING_BUNDLE: ${{ secrets.FOLIO_SIGNING_BUNDLE }}
      run: python3 scripts/sign-apk.py --input app/build/outputs/apk/release/app-release-unsigned.apk --output app/build/outputs/distribution/folio.apk

    - name: Upload consistently signed APK
      if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/upload-artifact@v4
      with:
        name: folio-apk
        path: app/build/outputs/distribution/
        if-no-files-found: error
        retention-days: 30

    - name: Publish downloadable release APK
      if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        RELEASE_TAG="folio-1.0.${FOLIO_VERSION_CODE}"
        args=()
        if [ "$EVENT_NAME" = "pull_request" ]; then args+=(--prerelease); fi
        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" app/build/outputs/distribution/folio.apk app/build/outputs/distribution/folio.sha256 --clobber
        else
          gh release create "$RELEASE_TAG" app/build/outputs/distribution/folio.apk app/build/outputs/distribution/folio.sha256 --target "$SOURCE_SHA" --title "Folio 1.0.${FOLIO_VERSION_CODE}" --notes-file docs/RELEASE-NOTES.md "${args[@]}"
        fi

    - name: Print lint errors
      if: failure()
      run: |
        if [ -f app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt ]; then
          cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
        fi

    - name: Upload test and lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-reports
        path: |
          app/build/reports/
          app/build/test-results/
          app/schemas/
        retention-days: 14
