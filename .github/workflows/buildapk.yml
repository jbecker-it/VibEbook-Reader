name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Ermöglicht den manuellen Start über die GitHub-Oberfläche

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FOLIO_VERSION_CODE: ${{ github.run_number }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test comic and novel layout
      run: |
        npm install --no-save --ignore-scripts playwright@1.56.1
        npx playwright install --with-deps chromium
        node scripts/test-reader-layout.cjs

    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Test, lint, and build APK
      run: ./gradlew testDebugUnitTest lintDebug assembleDebug
    
    - name: Test signing guards and repeatability
      run: python3 scripts/test-signing.py

    - name: Sign distributable APK with permanent key
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        FOLIO_SIGNING_BUNDLE: ${{ secrets.FOLIO_SIGNING_BUNDLE }}
      run: python3 scripts/sign-apk.py --input app/build/outputs/apk/debug/app-debug.apk --output app/build/outputs/distribution/folio.apk

    - name: Upload consistently signed APK
      if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/upload-artifact@v4
      with:
        name: folio-apk
        path: app/build/outputs/distribution/
        if-no-files-found: error
        retention-days: 30

    - name: Print lint errors
      if: failure()
      run: |
        if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
        fi

    - name: Upload test and lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-reports
        path: |
          app/build/reports/
          app/build/test-results/
        retention-days: 14
